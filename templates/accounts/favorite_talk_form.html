{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
  {{ view.object|yesno:"Edit Favorite Talk,Add Favorite Talk" }}
{% endblock %}

{% block content %}
<div class="container">
  <h1 class="mb-4">{{ view.object|yesno:"Edit Favorite Talk,Add Favorite Talk" }}</h1>
  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'accounts:favorite_talk_list' %}" class="btn btn-secondary">Back</a>
    </div>
  </form>
</div>
{% endblock %}
